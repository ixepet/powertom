notes = "1.7.2013\n三个场景对比完，结论很清楚：HaiMate更实用、经得住实际使用检验。为什么我们能做到？三个基因。第一，我们是干教育的，海亮办学30年、152所学校、20万师生，我们自己就在上课。第二，产品在学校里长大，自有校常态化使用，随时收集反馈、快速迭代，内部打磨好再推给外部。第三，我们有专家和资源，近80位正高级特级教师和金牌教练，评课标准、题库、教材知识体系都来自这里。这些，是通用大模型没有的东西。\n‹#›"

