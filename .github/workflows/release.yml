name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish gem (trusted publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build gem
        run: gem build powertom.gemspec

      - uses: rubygems/configure-rubygems-credentials@v1

      - name: Push to RubyGems
        run: gem push powertom-*.gem
