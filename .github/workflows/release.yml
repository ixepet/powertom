name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # contents: write 用于创建 GitHub Release;id-token: write 用于 RubyGems
  # trusted publishing(OIDC)
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish gem (trusted publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build gem
        run: gem build powertom.gemspec

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push to RubyGems
        run: gem push powertom-*.gem

      # Release notes 取 CHANGELOG 对应版本的段落(与历史 Release 风格一致),
      # 段落缺失时退回 "See CHANGELOG.md."
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby -e '
            version = ENV.fetch("GITHUB_REF_NAME").delete_prefix("v")
            text = File.read("CHANGELOG.md")
            section = text[/^## \[#{Regexp.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\z)/m, 1].to_s.strip
            body = section.empty? ? "See CHANGELOG.md." : "## What changed\n\n#{section}\n"
            body += "\n## Install\n\n```ruby\ngem \"powertom\", \"#{version}\"\n```\n"
            File.write("release-notes.md", body)
          '
          gh release create "$GITHUB_REF_NAME" \
            --title "PowerTom $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
