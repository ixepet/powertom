name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # contents: write 用于创建 GitHub Release(Rakefile 的 rake release
  # 也用它推送标签);id-token: write 用于 RubyGems trusted publishing(OIDC)
  # 与 Sigstore 签名
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish gem (trusted publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # 执行 bundle exec rake release:构建 gem、生成 Sigstore attestation
      # (RubyGems 会显示 "Provenance: Built and signed on GitHub Actions")、
      # 经 OIDC 推送并等待 RubyGems 可查询。取代手写的
      # configure-rubygems-credentials + gem push 两步。
      - uses: rubygems/release-gem@v1

      # Release notes 取 CHANGELOG 对应版本的段落(与历史 Release 风格一致),
      # 段落缺失时退回 "See CHANGELOG.md."
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby -e '
            version = ENV.fetch("GITHUB_REF_NAME").delete_prefix("v")
            text = File.read("CHANGELOG.md")
            section = text[/^## \[#{Regexp.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\z)/m, 1].to_s.strip
            body = section.empty? ? "See CHANGELOG.md." : "## What changed\n\n#{section}\n"
            body += "\n## Install\n\n```ruby\ngem \"powertom\", \"#{version}\"\n```\n"
            File.write("release-notes.md", body)
          '
          gh release create "$GITHUB_REF_NAME" \
            --title "PowerTom $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
